# ~/.config/db-mcp/config.yaml
# Database connections organized by project.
# Passwords can be written directly or via environment variables: ${VAR_NAME:-default}
# chmod 600 this file to protect credentials.

projects:
  myapp:
    description: "My application platform"
    workspaces:
      - "${HOME}/workspace"
      - "${HOME}/code/go/myapp-*"
      - "${HOME}/code/node/myapp-*"
      - "${HOME}/code/php/*"
    connections:
      main-db:
        type: mysql
        host: ${MYAPP_DB_HOST:-127.0.0.1}
        port: 3306
        database: myapp_db
        user: readonly
        password: ${MYAPP_DB_PASS}
      log-db:
        type: mysql
        database: myapp_log
        inherit: main-db
      manage-db:
        type: mysql
        database: myapp_manage
        inherit: main-db
      cache:
        type: redis
        host: ${MYAPP_REDIS_HOST:-127.0.0.1}
        port: 6379
        # tls: true   # enable for managed Redis with in-transit encryption (e.g. AWS ElastiCache)
      order-pg:
        type: postgres
        host: ${MYAPP_PG_HOST:-127.0.0.1}
        port: 5432
        database: tg_order
        user: readonly
        password: ${MYAPP_PG_PASS}
